name: build

# PC5 continuous build and release pipeline.
#
#   push to any branch / pull request  -> build + verify + test, keep the assets
#                                         as a workflow artifact
#   push a tag (v* or pc5-*)           -> the same, then publish the three
#                                         release assets to that GitHub release
#   manual dispatch                    -> build + verify + test only (no publish)
#
# Nothing is uploaded to a release unless every step of the build job passed:
# the publish job only runs when the tag job's `build` dependency succeeded.

on:
  push:
    branches: ["**"]
    tags: ["v*", "pc5-*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job asks for contents: write itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Naming `bash` explicitly is not a style choice.  On GitHub's Linux runners the *unspecified*
# default for a `run` step is `bash -e {0}` -- no `pipefail` -- while naming the shell brings
# `--noprofile --norc -eo pipefail`.  Every gate below is written `make <gate> | tee
# build/logs/<gate>.log` so the log survives in the uploaded artifact, and without pipefail the
# successful `tee` at the end of the pipe reports the step green after the gate failed.  A
# pipeline that cannot fail is worse than no pipeline: it is the same class of defect measured in
# docs/TEST_RESULTS.md §35, where a harness skipped 64 tests and still printed `OK`.
defaults:
  run:
    shell: bash

env:
  # The build reads both of these from the environment (see docs/BUILDING.md).
  # SOURCE_DATE_EPOCH is derived from the commit inside the job, because it is
  # only knowable after checkout.
  BUILD_ID: ${{ github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the environment
        run: |
          set -eu
          echo "ref:        ${GITHUB_REF}"
          echo "commit:     $(git rev-parse HEAD)"
          echo "kernel:     $(uname -srm)"
          echo "gcc:        $(gcc --version | head -n 1)"
          echo "ld:         $(ld --version | head -n 1)"
          echo "make:       $(make --version | head -n 1)"
          echo "python:     $(python3 --version)"
          echo "node:       $(node --version 2>/dev/null || echo none)"
          echo "gh:         $(gh --version | head -n 1)"

      - name: Configure reproducible build inputs
        run: |
          set -eu
          epoch=$(git log -1 --format=%ct "${GITHUB_SHA}")
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "$GITHUB_ENV"
          echo "commit time (SOURCE_DATE_EPOCH): ${epoch}"
          echo "build id: ${BUILD_ID}"

      - name: Build the ISO
        run: |
          set -eu
          make clean
          make iso | tee build-iso.log

      - name: Verify ISO structure and checksums
        run: make verify | tee build/verify.log

      - name: Kernel unit tests
        run: |
          set -eu
          mkdir -p build/logs
          make unit | tee build/logs/unit.log

      # The venv is built here, not only in the stub-firmware step below, because
      # tests/test_kernel64.py and its siblings *skip* when `unicorn` is missing -- and a skip
      # never fails a step, it simply does not run.  Measured locally: with the module absent that
      # module reports `OK` after skipping 64 of its own cases, which is the difference between a
      # certified boot and an unexecuted one.  The assertion after the install is what turns that
      # into a red job instead of a quiet suite.
      - name: Provision the harness venv
        run: |
          set -eu
          # Install into a virtual environment instead of system Python.
          # The runner image marks its Python as externally managed (PEP 668),
          # so a bare `pip install` aborts the job with
          # "error: externally-managed-environment" before any test runs.
          # Putting the venv first on PATH is what makes the Makefile's
          # `python3` resolve to it, so `make stubtest` actually finds unicorn.
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check "unicorn==2.1.4"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.venv/bin:$PATH"
          python3 -c "import unicorn; print('unicorn', unicorn.__version__)"

      - name: Host tool tests
        run: |
          set -eu
          export PATH="$PWD/.venv/bin:$PATH"
          # Record the interpreter inside the log: the venv is first on PATH here, and the
          # runner's Python is not this repository's Python, so a version-dependent failure has
          # to be attributable from the log alone.
          python3 -VV 2>&1 | tee build/logs/host.log
          python3 -c 'import unicorn; print("unicorn", unicorn.__version__)' 2>&1 | tee -a build/logs/host.log
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee -a build/logs/host.log
          # Read the count, not the verdict.  `OK` is compatible with a suite that barely ran, so
          # the tally and every skip reason go into the job summary where a reviewer sees them.
          tail -n 3 build/logs/host.log | sed -n 's/^/::notice title=Host suite ::/p' || true
          {
            echo "### Host suite"
            echo
            grep -E "^(Ran |OK|FAILED)" build/logs/host.log | sed 's/^/- /'
            echo
            echo "- skip reasons (each is an environment statement, never a pass):"
            grep -oE "skipped '[^']*'" build/logs/host.log | sort | uniq -c | sed 's/^/  - /' \
              || echo "  - none"
          } >> "$GITHUB_STEP_SUMMARY"

      # The architecture is machine-checked: the roadmap graph must validate,
      # the generated milestone document must match the data, and the product
      # identity in `roadmap.json` must still agree with the documents.  This
      # is deliberately a separate gate from the unit tests so that a broken
      # graph fails with the validator's message rather than a test traceback.
      - name: Architecture and roadmap gate
        run: make roadmap | tee build/logs/roadmap.log

      # `make check` runs six gates around the suite: unit, psm, docs-check, citations-check,
      # presentation-check, brand-check.  Two of them had no CI step at all, so the platform
      # contract (psm/registry.py, audit, conformance) and the generated brand assets could drift
      # out of agreement with the tree while every CI job stayed green.
      - name: Platform-contract and brand gates
        run: |
          set -eu
          make psm | tee build/logs/psm.log
          make brand-check | tee build/logs/brand-check.log

      # These are the gates `make check` runs that the pipeline used to omit, which left CI able
      # to go green while the documents contradicted the code (docs-check), while a status figure
      # drifted from roadmap.json (presentation-check), or while a commit citation pointed at an
      # object no longer in the clone (citations-check).  `fetch-depth: 0` above is what makes the
      # last one meaningful, and citation-refs fetches the pull-request heads the evidence cites --
      # a dead citation is a statement about the checkout before it is one about the history.
      - name: Documentation and evidence gates
        run: |
          set -eu
          mkdir -p build/logs
          make docs-check | tee build/logs/docs-check.log
          make presentation-check | tee build/logs/presentation-check.log
          make citation-refs | tee build/logs/citation-refs.log
          make citations-check | tee build/logs/citations.log

      - name: Execute the UEFI loader against the stub firmware
        run: |
          set -eu
          # The venv provisioned above is already on PATH through $GITHUB_PATH; the export repeats
          # it on purpose, because a silent fallback to the system python would turn the long-mode
          # boot into a skip, and the line after it is what notices.
          export PATH="$PWD/.venv/bin:$PATH"
          python3 -c "import unicorn; print('unicorn', unicorn.__version__)"
          make stubtest | tee build/logs/stubtest.log
          # The 64-bit path, which is the one the loader actually hands off to.
          # `tests/test_tss64.py` and `tests/test_boot64_stub.py` are already inside the
          # host suite above, but neither executes the image: `stubtest64` does, and
          # before this line the pipeline could go green with the long-mode boot
          # unexecuted.  It is a separate gate because it needs separate artefacts
          # (boot/uefi64, kernel64) and reports its own JSON.
          make stubtest64 | tee build/logs/stubtest64.log
          # And the record of what this emulator can and cannot prove, so that the
          # interpretation of `tr=not-loaded` in the run above is attached to the run
          # rather than to a document.  The probe exits 0 either way by design.
          make emulator-probe EMULATOR_PROBE_ARGS=--json \
            | tee build/logs/emulator-capabilities.json

      - name: Boot the image in the emulator
        run: |
          set -eu
          npm install --no-save --no-audit --no-fund v86-system
          make boot-test | tee build/logs/boot.log

      - name: Prove the build is reproducible
        run: |
          set -eu
          first=$(sha256sum build/pc5.iso | cut -d' ' -f1)
          echo "first build:  ${first}"
          make clean
          make iso > /dev/null
          second=$(sha256sum build/pc5.iso | cut -d' ' -f1)
          echo "second build: ${second}"
          echo "sha256=${second}" >> "$GITHUB_ENV"
          if [ "${first}" != "${second}" ]; then
            echo "::error::the two builds differ; the image is not reproducible with SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} and BUILD_ID=${BUILD_ID}"
            exit 1
          fi
          echo "reproducible: two independent builds produced ${second}" | tee build/reproducibility.txt

      - name: Verify, test and stage the release assets
        run: |
          set -eu
          mkdir -p build/logs
          # the verifier must run again on the image that will ship
          make verify | tee build/verify-final.log
          make unit > build/logs/unit.log
          python3 -m unittest discover -s tests -p 'test_*.py' > build/logs/host.log 2>&1
          make boot-test
          make release-assets TAG="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA}" \
            PC5_CI_PROVIDER=github \
            PC5_CI_WORKFLOW="${GITHUB_WORKFLOW}" \
            PC5_CI_RUN_ID="${GITHUB_RUN_ID}" \
            PC5_CI_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Build and verify the 64-bit release image
        # `PC5_UEFI=64` is the opt-in that puts the long-mode loader and KERNEL64.BIN in
        # the release ESP, and `make verify` then proves those bytes are the ones
        # `make stubtest64` executed.  It runs in CI so the option cannot rot into
        # something that only works on the machine that added it -- the target is a
        # recipe line, and nothing else would ever type it.
        #
        # It builds into build/iso64 on purpose: the step above stages build/pc5.iso,
        # and a 64-bit image must not overwrite the artifact that ships.  A subdirectory
        # of build/ rather than a sibling directory, so the scratch tree is ignored and
        # deleted by the same rules as the rest of the build output.
        # This is packaging, not booting; the OVMF job below is what would say firmware
        # reaches it, and it reports NOT TESTED wherever QEMU and OVMF are missing.
        run: |
          set -eu
          make BUILD=build/iso64 iso64 | tee build/logs/iso64.log

      - name: Check the staged assets
        run: |
          set -eu
          cd build/release
          ls -l
          sha256sum -c pc5.iso.sha256
          python3 - <<'PY'
          import json
          info = json.load(open("build-info.json"))
          build = info.get("build", {})
          verdict = build.get("verification", {}).get("verdict")
          print("version:", build.get("version"), "commit:", build.get("commit"))
          print("verification verdict:", verdict)
          if verdict != "PASS":
              raise SystemExit(f"refusing to publish: verification verdict is {verdict!r}")
          if info["build"]["artifact"]["sha256"] != info["sha256"]:
              raise SystemExit("build record and image disagree")
          PY

      - name: Keep the assets for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc5-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30

      # A gate that fails must leave its own text where it can be read without the run page.  The
      # raw Actions log lives on a host a sandboxed environment cannot reach, and so does every
      # uploaded artifact - which leaves a pipeline whose only diagnosis is "step 9 failed"
      # undiagnosable from anywhere but a browser.  Job summaries and annotations come back from the
      # endpoints that are reachable, so a failed gate quotes itself.  `if: failure()` means this runs
      # only when something already broke: it can neither turn a red job green nor add a step to a
      # passing one, and it re-reads logs no gate writes, so nothing existing is weakened.
      # A gate that fails must leave its own text where it can be read without the run page.  The
      # raw Actions log lives on a host a sandboxed environment cannot reach, and so does every
      # uploaded artifact, which leaves a pipeline whose only diagnosis is "step 9 failed"
      # undiagnosable from anywhere but a browser.  Annotations and the job summary come back from
      # the endpoints that are reachable (`/repos/{o}/{r}/check-runs/{id}/annotations`), so a
      # failed gate quotes itself.  `if: failure()` means this runs only when something already
      # broke: it can neither turn a red job green nor add a step to a passing one, and it re-reads
      # logs no gate writes, so nothing existing is weakened or reordered.
      - name: Report which gate failed, and what it said
        if: failure()
        # A gate that fails must leave its own text where a restricted caller can read it: the
        # raw Actions log and every artifact live on hosts outside this repository, and the Checks
        # API annotations do not.  The script quotes the failure blocks the gates already wrote,
        # plus what the runner has installed, and always exits 0 so that describing a failure
        # cannot become a second one.  `if: failure()` means it runs only when something already
        # broke: it can neither turn a red job green nor add a step to a passing job, and it reads
        # logs no gate writes, so nothing existing is weakened or reordered.
        run: python3 tools/ci_report.py

      # `discover` says nothing when the interpreter *dies*: exit 139 arrives at the shell,
      # the log stops mid-line, and there is no `FAIL:` block to quote because no test
      # failed -- which is exactly how this pipeline's third run ended.  The only way to name
      # the module is to run them one at a time.  A diagnostic, not a gate: guarded by
      # `if: failure()` so it never runs on a green job, and it writes
      # build/logs/triage.json -- which the reporter above does *not* read: it runs one step
      # earlier, so triage.json does not exist yet.  What reaches a caller who cannot download
      # an artifact is this step's own `::notice`/`::error` workflow commands, and the JSON is
      # the copy kept for whoever can.  Order matters and `tests/test_ci_report.py` pins it:
      # the reporter reads the gates first, so the summary leads with what the harness itself
      # said, and the per-file tally follows as the deeper layer.
      - name: Name the module that killed the interpreter
        if: failure()
        run: |
          set -uo pipefail
          python3 tools/ci_triage.py --root tests --python python3 \
            --json-out build/logs/triage.json


      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc5-logs-${{ github.sha }}
          path: |
            build/logs/
            build/verify.log
            build/verify-report.json
            build/test/
            build-iso.log
          if-no-files-found: warn
          retention-days: 14

  # The UEFI integration gate.  It is a separate job on purpose: it needs real
  # firmware and a real emulator, and a run in which either is missing must fail
  # here rather than be quietly folded into the boot job.  Exit code 3 from the
  # harness (NOT TESTED) fails this job, by design - a green pipeline that never
  # executed firmware would be the whole problem this gate exists to prevent.
  ovmf:
    name: UEFI boot under genuine OVMF
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false   # as in the other two jobs: leave no token in .git/config

      - name: Provision QEMU and TianoCore OVMF
        run: |
          set -eu
          mkdir -p build build/logs     # a fresh checkout has no build/, and two steps below
                                        # tee into it before `make` would have created it
          ./tools/ovmf_setup.sh
          # Record exactly which firmware this run used.
          ./tools/ovmf_setup.sh --check | tee build/ovmf-setup.log || true

      - name: Build the image under test
        run: |
          set -eu
          mkdir -p build
          make iso
          make uefi

      - name: Boot it under OVMF, including the Secure Boot policy check
        run: |
          set -eu
          # any exit code other than 0 fails the step; 3 (NOT TESTED) included.
          # With pipefail the tee below cannot hide that, and without it this whole job would be
          # decorative: a runner with no firmware would print a green tick over an unexecuted boot.
          make ovmf-test OVMF_ARGS="--secure-boot" 2>&1 | tee build/logs/ovmf-test.log
          # Report what the firmware actually concluded, counting the harness's own markers rather
          # than re-deriving a tally from the JSON (whose `checks` list and the requirement matrix
          # are different counts, and conflating them is how 104 became 105 once already).
          {
            echo "### Genuine OVMF boot"
            echo
            echo "- gate log [PASS] lines: $(grep -c '^\[PASS\]' build/logs/ovmf-test.log || true)"
            echo "- gate log [FAIL] lines: $(grep -c '^\[FAIL\]' build/logs/ovmf-test.log || true)"
            echo "- not-tested lines: $(grep -cE 'NOT TESTED|\[N/A\]' build/logs/ovmf-test.log || true)"
            echo
            grep -E "PC5-OVMF-BOOT-OK|NOT TESTED" build/logs/ovmf-test.log | tail -n 4 | sed 's/^/> /'
          } >> "$GITHUB_STEP_SUMMARY"

      # A gate that fails must leave its own text where it can be read without the run page.  The
      # raw Actions log lives on a host a sandboxed environment cannot reach, and so does every
      # uploaded artifact, which leaves a pipeline whose only diagnosis is "step 9 failed"
      # undiagnosable from anywhere but a browser.  Annotations and the job summary come back from
      # the endpoints that are reachable (`/repos/{o}/{r}/check-runs/{id}/annotations`), so a
      # failed gate quotes itself.  `if: failure()` means this runs only when something already
      # broke: it can neither turn a red job green nor add a step to a passing one, and it re-reads
      # logs no gate writes, so nothing existing is weakened or reordered.
      - name: Report what the firmware run concluded
        if: failure()
        # Same script, same reason.  The firmware job writes build/logs/ovmf-test.log, which is
        # where its verdict actually lives, and `NOT TESTED` is a line this step will quote rather
        # than summarise - exit code 3 failing the job is the point, not something to soften here.
        run: python3 tools/ci_report.py

      # `discover` says nothing when the interpreter *dies*: exit 139 arrives at the shell,
      # the log stops mid-line, and there is no `FAIL:` block to quote because no test
      # failed -- which is exactly how this pipeline's third run ended.  The only way to name
      # the module is to run them one at a time.  A diagnostic, not a gate: guarded by
      # `if: failure()` so it never runs on a green job, and it writes
      # build/logs/triage.json -- which the reporter above does *not* read: it runs one step
      # earlier, so triage.json does not exist yet.  What reaches a caller who cannot download
      # an artifact is this step's own `::notice`/`::error` workflow commands, and the JSON is
      # the copy kept for whoever can.  Order matters and `tests/test_ci_report.py` pins it:
      # the reporter reads the gates first, so the summary leads with what the harness itself
      # said, and the per-file tally follows as the deeper layer.
      # A firmware harness that dies takes its traceback with it, and this job boots QEMU
      # hundreds of times, so triaging all 118 modules here would be a second job inside the
      # first: `--only ovmf` narrows the walk to the suite that actually ran.
      - name: Name the module that killed the interpreter
        if: failure()
        run: |
          set -uo pipefail
          python3 tools/ci_triage.py --root tests --python python3 --only ovmf \
            --json-out build/logs/triage.json


      - name: Keep the firmware report, serial logs and the matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc5-ovmf-${{ github.sha }}
          path: |
            build/ovmf-report.json
            build/ovmf-matrix.json
            build/ovmf/
            build/ovmf-setup.log
          if-no-files-found: warn
          retention-days: 30

  release:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the only job allowed to publish
    steps:
      - name: Check out the scripts used to publish
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pc5-${{ github.sha }}
          path: dist

      - name: Check the assets before publishing
        run: |
          set -eu
          cd dist
          ls -l
          sha256sum -c pc5.iso.sha256
          test -f build-info.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/publish_release.sh --tag "${GITHUB_REF_NAME}" --dist dist
