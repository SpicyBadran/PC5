<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="t d">
  <title id="t">PC5 boot and installation workflow</title>
  <desc id="d">Six steps from building the ISO to genuine Sony system software. Steps one and two are verified; writing media and booting a physical PC are not tested; the destination is blocked.</desc>
  <rect width="1000" height="590" fill="#0b0f14"/>
  <text x="48" y="46" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" fill="#e6edf3" font-weight="bold" text-anchor="start">FROM COMMIT TO BOOT</text>
  <text x="48" y="70" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8b98a8" font-weight="normal" text-anchor="start">what is proven today, and what is still only intended</text>
  <rect x="48" y="94" width="904" height="62" rx="10" fill="#131a23" stroke="#243040"/>
  <circle cx="86" cy="125.0" r="17" fill="#0f151d" stroke="#34d399" stroke-width="1.5"/>
  <text x="86" y="130.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#34d399" font-weight="bold" text-anchor="middle">1</text>
  <text x="120" y="121" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">Build the ISO</text>
  <text x="120" y="141" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">make — reproducible, SOURCE_DATE_EPOCH pinned</text>
  <rect x="742" y="114" width="76" height="22" rx="11" fill="#34d399" opacity="0.14" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="780.0" y="129" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#34d399" font-weight="bold" text-anchor="middle">VERIFIED</text>
  <line x1="86" y1="156" x2="86" y2="163" stroke="#243040" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 81 162 L 86 170 L 91 162" fill="none" stroke="#243040" stroke-width="1.5"/>
  <rect x="48" y="170" width="904" height="62" rx="10" fill="#0f151d" stroke="#243040"/>
  <circle cx="86" cy="201.0" r="17" fill="#0f151d" stroke="#34d399" stroke-width="1.5"/>
  <text x="86" y="206.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#34d399" font-weight="bold" text-anchor="middle">2</text>
  <text x="120" y="197" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">Verify image and manifest</text>
  <text x="120" y="217" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">make verify — structure, files, boot entries</text>
  <rect x="742" y="190" width="76" height="22" rx="11" fill="#34d399" opacity="0.14" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="780.0" y="205" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#34d399" font-weight="bold" text-anchor="middle">VERIFIED</text>
  <line x1="86" y1="232" x2="86" y2="239" stroke="#243040" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 81 238 L 86 246 L 91 238" fill="none" stroke="#243040" stroke-width="1.5"/>
  <rect x="48" y="246" width="904" height="62" rx="10" fill="#131a23" stroke="#243040"/>
  <circle cx="86" cy="277.0" r="17" fill="#0f151d" stroke="#8b98a8" stroke-width="1.5"/>
  <text x="86" y="282.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#8b98a8" font-weight="bold" text-anchor="middle">3</text>
  <text x="120" y="273" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">Write to USB media</text>
  <text x="120" y="293" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">byte-for-byte; read the medium back and hash it</text>
  <rect x="742" y="266" width="90" height="22" rx="11" fill="#8b98a8" opacity="0.14" stroke="#8b98a8" stroke-opacity="0.55"/>
  <text x="787.0" y="281" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#8b98a8" font-weight="bold" text-anchor="middle">NOT TESTED</text>
  <line x1="86" y1="308" x2="86" y2="315" stroke="#243040" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 81 314 L 86 322 L 91 314" fill="none" stroke="#243040" stroke-width="1.5"/>
  <rect x="48" y="322" width="904" height="62" rx="10" fill="#0f151d" stroke="#243040"/>
  <circle cx="86" cy="353.0" r="17" fill="#0f151d" stroke="#8b98a8" stroke-width="1.5"/>
  <text x="86" y="358.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#8b98a8" font-weight="bold" text-anchor="middle">4</text>
  <text x="120" y="349" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">Boot a PC via firmware menu</text>
  <text x="120" y="369" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">UEFI, or legacy BIOS/CSM where offered</text>
  <rect x="742" y="342" width="90" height="22" rx="11" fill="#8b98a8" opacity="0.14" stroke="#8b98a8" stroke-opacity="0.55"/>
  <text x="787.0" y="357" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#8b98a8" font-weight="bold" text-anchor="middle">NOT TESTED</text>
  <line x1="86" y1="384" x2="86" y2="391" stroke="#243040" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 81 390 L 86 398 L 91 390" fill="none" stroke="#243040" stroke-width="1.5"/>
  <rect x="48" y="398" width="904" height="62" rx="10" fill="#131a23" stroke="#243040"/>
  <circle cx="86" cy="429.0" r="17" fill="#0f151d" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="86" y="434.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#fbbf24" font-weight="bold" text-anchor="middle">5</text>
  <text x="120" y="425" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">PC5 initialises the machine</text>
  <text x="120" y="445" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">inventory, storage, console — emulated only so far</text>
  <rect x="742" y="418" width="132" height="22" rx="11" fill="#fbbf24" opacity="0.14" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="808.0" y="433" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#fbbf24" font-weight="bold" text-anchor="middle">TESTING REQUIRED</text>
  <line x1="86" y1="460" x2="86" y2="467" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 81 466 L 86 474 L 91 466" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <rect x="48" y="474" width="904" height="62" rx="10" fill="#0f151d" stroke="#243040"/>
  <circle cx="86" cy="505.0" r="17" fill="#0f151d" stroke="#f87171" stroke-width="1.5"/>
  <text x="86" y="510.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#f87171" font-weight="bold" text-anchor="middle">6</text>
  <text x="120" y="501" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">Sony system software executes</text>
  <text x="120" y="521" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8b98a8" font-weight="normal" text-anchor="start">the destination; no lawful path exists yet</text>
  <rect x="742" y="494" width="69" height="22" rx="11" fill="#f87171" opacity="0.14" stroke="#f87171" stroke-opacity="0.55"/>
  <text x="776.5" y="509" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#f87171" font-weight="bold" text-anchor="middle">BLOCKED</text>
  <text x="48" y="566" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#fbbf24" font-weight="normal" text-anchor="start">a PUP placed inside an ISO is not a bootable PS5 system — see docs/PS5_SYSTEM_SOFTWARE_TARGET.md</text>
</svg>
